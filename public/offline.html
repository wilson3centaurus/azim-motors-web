<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hazim Motors Offline</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081311;
      --panel: #102623;
      --line: #29413c;
      --text: #eef7f4;
      --muted: #a6bbb5;
      --accent: #1f5f59;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(31,95,89,0.16), transparent 28%), linear-gradient(180deg, #050d0c 0%, var(--bg) 100%);
      font-family: Aptos, "Segoe UI", sans-serif;
      color: var(--text);
    }
    .card {
      width: min(100%, 440px);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(16, 38, 35, 0.94);
      padding: 28px;
      box-shadow: 0 30px 80px -48px rgba(0, 0, 0, 0.8);
    }
    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(31,95,89,0.2);
      color: #9cd1c4;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 10px; font-size: 28px; }
    p { margin: 0; color: var(--muted); line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Offline</div>
    <h1>Hazim Motors</h1>
    <p>You are offline right now. Reconnect to continue with workshop operations and sync the latest job, customer, and inventory data.</p>
  </div>
</body>
</html>
